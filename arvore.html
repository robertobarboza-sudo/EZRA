      font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all var(--transition);
    }
    .bkl-ontime-btn:hover { background: rgba(238,77,45,.16); }
    .bkl-ontime-btn i { font-size: 11px; }
    .bkl-ontime-btn.active { background: var(--orange); color: #fff; box-shadow: 0 2px 10px rgba(238,77,45,.35); }
    .lh-fila-ofensor { color: #ff5b5b; font-weight: 700; }
    .tv-mode-btn.dl-btn.active { background: var(--orange) !important; color: #fff !important; border-color: var(--orange) !important; }
    .tv-mode-active #header, .tv-mode-active #sidebar, .tv-mode-active #sidebar-overlay { display: none !important; }
    .tv-mode-active #app { margin-left: 0 !important; }
    .tv-mode-active #main-content { padding: 32px 40px !important; }
    .tv-mode-active .section-dl-group, .tv-mode-active .spr-filters, .tv-mode-active .table-search, .tv-mode-active .pdf-menu-wrap { display: none !important; }
    .tv-rotation-badge { position: fixed; top: 16px; right: 16px; z-index: 9999; background: rgba(0,0,0,.55); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
    .tvcfg-page-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .tvcfg-page-check { flex:1; display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; }
    .tvcfg-page-check.checked { border-color: var(--orange); background: rgba(238,77,45,.06); }
    .tvcfg-mode-btn { flex:0 0 auto; width:38px; height:38px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background var(--transition), color var(--transition); }
    .tvcfg-mode-btn:hover { border-color: var(--orange); color: var(--orange); }

    .spr-ms-wrap { position: relative; display: inline-flex; }
    .spr-ms-btn {
      padding: 5px 12px; border-radius: var(--radius);
      font-size: 11px; font-weight: 700; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text-muted);
      font-family: inherit; transition: all var(--transition); letter-spacing: .02em;
      display: flex; align-items: center; gap: 6px;
    }
    .spr-ms-btn:hover { border-color: var(--orange); color: var(--orange); }
    .spr-ms-btn.active { background: rgba(238,77,45,.1); border-color: var(--orange); color: var(--orange); }
    .spr-ms-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
      width: 240px; max-height: 280px; z-index: 600; overflow: hidden;
      flex-direction: column;
    }
    .spr-ms-dropdown.open { display: flex; }
    .spr-ms-search {
      margin: 8px; padding: 6px 10px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-size: 12px; font-family: inherit;
    }
    .spr-ms-list { overflow-y: auto; padding: 0 4px 8px; }
    .spr-ms-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; font-size: 12px; color: var(--text-sub);
      cursor: pointer; border-radius: var(--radius);
    }
    .spr-ms-item:hover { background: var(--surface-3); }
    .spr-ms-item input { accent-color: var(--orange); }
    .spr-ms-empty { padding: 12px; font-size: 11px; color: var(--text-muted); text-align: center; }
    .spr-lt-footer {
      margin-top: 10px; font-size: 11px; color: var(--text-muted);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .spr-lt-footer:empty { display: none; }
    .pulso-pager { display: flex; align-items: center; gap: 10px; }
    .pulso-pager button[disabled] { opacity: .4; cursor: default; pointer-events: none; }
    .pulso-coverage {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--text-muted);
      margin: 10px 0 4px;
    }
    .pulso-coverage i { color: var(--orange); font-size: 11px; }
    .spr-ms-actions {
      display: flex; gap: 6px; padding: 8px 8px 0;
      border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 0 4px 4px;
    }
    .spr-ms-action-btn {
      flex: 1; padding: 5px 8px; border-radius: var(--radius);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
      cursor: pointer; font-family: inherit; transition: all var(--transition);
    }
    .spr-ms-action-btn:hover { border-color: var(--orange); color: var(--orange); }

    /* Ordenação de colunas na tabela de LTs */
    .spr-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    .spr-sortable:hover { color: var(--orange); }
    .spr-sortable i { font-size: 9px; margin-left: 4px; opacity: .4; }
    .spr-sortable.active i { opacity: 1; color: var(--orange); }

    /* Pipboy */
    .spr-pipboy-btn {
      padding: 6px 14px; border-radius: var(--radius);
      font-size: 11px; font-weight: 700; cursor: pointer;
      border: 1px solid rgba(101,209,165,.4); background: rgba(101,209,165,.08); color: #3fae82;
      font-family: inherit; transition: all var(--transition); letter-spacing: .02em;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .spr-pipboy-btn:hover { background: rgba(101,209,165,.18); box-shadow: 0 2px 10px rgba(101,209,165,.25); }
    .spr-pipboy-insight {
      display: flex; gap: 10px; padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .spr-pipboy-insight:last-child { border-bottom: none; }
    .spr-pipboy-insight i { color: #3fae82; font-size: 14px; margin-top: 2px; flex-shrink: 0; }
    .spr-pipboy-insight-text { font-size: 12.5px; color: var(--text-sub); line-height: 1.5; }
    .spr-pipboy-insight-text strong { color: var(--text); }
    .spr-pipboy-loading img { width: 100%; height: auto; display: block; border-radius: var(--radius-lg); }
    .spr-pipboy-loading-text {
      text-align: center; margin-top: 12px; font-size: 12px;
      color: var(--text-muted); letter-spacing: .04em;
    }
    .spr-pipboy-loading-text i { color: #3fae82; margin-right: 6px; }

    /* ── GOVERNANÇA ──────────────────────────────────────────── */
    .gov-section { margin-bottom: 32px; }
    .gov-section-title {
      font-size: 15px; font-weight: 800; color: var(--text);
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 2px solid var(--orange);
    }
    .gov-section-title .gov-num {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--orange); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; flex-shrink: 0;
    }

    /* Sub-items a) b) */
    .gov-sub-list { display: flex; flex-direction: column; gap: 10px; margin-left: 16px; }
    .gov-sub-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px 20px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .gov-sub-letter {
      width: 24px; height: 24px; border-radius: var(--radius);
      background: rgba(238,77,45,.1); color: var(--orange);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; flex-shrink: 0;
    }
    .gov-sub-content { flex: 1; }
    .gov-sub-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .gov-sub-desc { font-size: 12px; color: var(--text-muted); }

    /* Plano de comunicação */
    .com-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
      gap: 12px;
    }
    .com-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px;
      display: flex; flex-direction: column; gap: 6px;
      transition: border-color var(--transition), transform var(--transition);
    }
    .com-card:hover { border-color: var(--orange); transform: translateY(-2px); }
    .com-card-freq {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .08em; color: var(--orange); margin-bottom: 2px;
    }
    .com-card-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .com-card-desc { font-size: 11px; color: var(--text-muted); }

    /* Matriz de responsabilidade */
    .resp-table-wrap { overflow-x: auto; border-radius: var(--radius-lg); }
    .resp-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 700px; }
    .resp-table th {
      background: var(--surface-2); padding: 10px 14px;
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted);
      border-bottom: 1px solid var(--border); text-align: left;
    }
    .resp-table td {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      color: var(--text); vertical-align: top;
    }
    .resp-table tr:last-child td { border-bottom: none; }
    .resp-table tr:hover td { background: var(--surface-2); }
    .resp-pill {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%;
      font-size: 10px; font-weight: 800;
    }
    .resp-pill.R { background: rgba(238,77,45,.15); color: var(--orange); }
    .resp-pill.A { background: rgba(16,185,129,.15); color: #10b981; }
    .resp-pill.C { background: rgba(6,182,212,.15); color: var(--cyan); }
    .resp-pill.I { background: rgba(148,151,176,.12); color: #9497b0; }
    .resp-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; }
    .resp-legend-item { display: flex; align-items: center; gap: 6px; }

    /* Ferramentas */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
      gap: 16px;
    }
    .tool-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
      cursor: pointer; transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
      text-decoration: none; color: inherit; display: block;
    }
    .tool-card:hover { border-color: var(--orange); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(238,77,45,.15); }
    .tool-card-thumb {
      height: 110px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      overflow: hidden; position: relative;
    }
    .tool-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .tool-card-thumb .tool-icon { opacity: .4; }
    .tool-card-body { padding: 14px; }
    .tool-card-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .tool-card-desc { font-size: 11px; color: var(--text-muted); }
    .tool-card-link { font-size: 10px; color: var(--orange); margin-top: 8px; display: flex; align-items: center; gap: 4px; }
    .jarvis-feature-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
    .jarvis-feature-list li { font-size: 11px; color: var(--text-muted); display: flex; align-items: baseline; gap: 6px; }
    .jarvis-feature-list li i { color: var(--orange); font-size: 8px; }
    .jarvis-subpage-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .jarvis-subpage-pill { font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; }
    .jarvis-subpage-pill:hover { border-color: var(--orange); color: var(--orange); }
    .jarvis-subpage-pill.wip { opacity: .5; cursor: default; }
    .jarvis-subpage-pill.wip:hover { border-color: var(--border); color: var(--text-muted); }
    .jarvis-roadmap-card { flex: 0 0 100%; width: 100%; box-sizing: border-box; background: var(--surface); padding: 32px 64px; display: flex; flex-direction: column; justify-content: center; min-height: 320px; }
    .jarvis-roadmap-title { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .jarvis-roadmap-text { font-size: 13px; color: var(--text-muted); line-height: 1.8; max-width: 640px; }
    .jarvis-roadmap-pipboy { width: 100%; max-width: 190px; margin: 0 auto 16px; display: block; filter: drop-shadow(0 8px 24px rgba(238,77,45,.25)); }
    .jarvis-version-block { margin-top: 18px; }
    .jarvis-version-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .jarvis-version-badge { display: inline-block; font-size: 10px; font-weight: 800; background: var(--orange); color: #fff; padding: 3px 9px; border-radius: 20px; margin-left: 8px; vertical-align: middle; white-space: nowrap; }
    .jarvis-version-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .jarvis-version-list li { font-size: 12px; color: var(--text-muted); display: flex; align-items: baseline; gap: 6px; }
    .jarvis-version-list li i { color: var(--orange); font-size: 8px; }

    /* Carrossel do card de roadmap (V.1 / Resumo / Próximas Entregas) */
    .jarvis-carousel { position: relative; margin-bottom: 28px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .jarvis-carousel-viewport { overflow: hidden; border-radius: var(--radius-lg); }
    .jarvis-carousel-track { display: flex; transition: transform .35s ease; }
    .jarvis-carousel-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 36px; height: 36px; border-radius: 50%; background: var(--surface);
      border: 1px solid var(--border); color: var(--text-muted);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .jarvis-carousel-arrow:hover { background: var(--orange); color: #fff; border-color: var(--orange); }
    .jarvis-carousel-arrow.left { left: 12px; }
    .jarvis-carousel-arrow.right { right: 12px; }
    .jarvis-carousel-fullscreen {
      position: absolute; top: 12px; right: 12px; z-index: 3;
      width: 32px; height: 32px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }
    .jarvis-carousel-fullscreen:hover { background: var(--orange); color: #fff; }
    .jarvis-carousel-dots { display: flex; justify-content: center; gap: 8px; padding: 12px 0; }
    .jarvis-carousel-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); cursor: pointer; transition: background var(--transition), width var(--transition); }
    .jarvis-carousel-dot.active { background: var(--orange); width: 20px; border-radius: 4px; }
    .jarvis-carousel:fullscreen { display: flex; flex-direction: column; justify-content: center; background: var(--bg); }
    .jarvis-carousel:fullscreen .jarvis-roadmap-card { min-height: 0; }
    .jarvis-carousel:fullscreen .jarvis-roadmap-title { font-size: 26px; }
    .jarvis-carousel:fullscreen .jarvis-roadmap-text { font-size: 18px; max-width: 900px; }
    .jarvis-carousel:fullscreen .jarvis-version-title { font-size: 20px; }
    .jarvis-carousel:fullscreen .jarvis-version-list li { font-size: 16px; }
    .jarvis-carousel:fullscreen .jarvis-roadmap-pipboy { max-width: 280px; }
    .jarvis-feedback-qr { width: 180px; height: 180px; margin: 16px auto; display: block; border-radius: var(--radius); background: #fff; padding: 10px; }
    .jarvis-carousel:fullscreen .jarvis-feedback-qr { width: 280px; height: 280px; }
    .jarvis-catalog-slide-icon { font-size: 44px; color: var(--orange); margin-bottom: 14px; }
    .jarvis-catalog-slide-icon .tool-icon { opacity: 1; }

    /* ── OVERVIEW KPIS — porte do dashboard.html (React) enviado pelo
       Roberto em 2026-08-12, reescrito em JS puro (sem dependência de
       React/Babel via CDN, fora do padrão do resto do site) e reskinned
       pra usar as mesmas variáveis de tema (var(--surface)/--text/--border
       etc.) em vez da paleta laranja isolada do mockup original. Dados
       ainda mock (embutidos em KOV_MOCK) — aguardando a planilha real. */
    .kov-cards{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(228px, 1fr)); }
    .kov-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 14px 12px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
    .kov-card::before{ content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--kov-tone); }
    .kov-name{ font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); }
    .kov-info-btn{ cursor:pointer; color:var(--text-muted); opacity:.7; font-size:10.5px; transition:opacity var(--transition), color var(--transition); }
    .kov-info-btn:hover{ opacity:1; color:var(--orange); }
    .kov-col-divider{ border-left:1px solid var(--border); }
    .kov-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:8px; }
    .kov-val{ font-size:28px; font-weight:800; letter-spacing:-.02em; line-height:1; color:var(--kov-tone); }
    .kov-chip{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--kov-tone-bg); color:var(--kov-tone); white-space:nowrap; flex:none; }
    .kov-meta{ display:flex; justify-content:space-between; gap:8px; margin-top:10px; padding-top:9px; border-top:1px solid var(--border); font-size:12px; color:var(--text-muted); }
    .kov-meta b{ color:var(--text); font-weight:600; }
    .kov-turnos{ margin-top:9px; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
    .kov-turnos div{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:4px 9px; font-size:12px; font-weight:600; background:var(--surface-2); }
    .kov-turnos div+div{ border-top:1px solid var(--border); }
    .kov-turnos span{ color:var(--text-muted); font-size:10px; font-weight:700; letter-spacing:.06em; }
    .kov-table-wrap{ overflow:auto; max-height:70vh; }
    .kov-table{ border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; }
    .kov-table th, .kov-table td{ padding:8px 11px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--border); }
    .kov-table th{ position:sticky; top:0; z-index:2; background:var(--surface-2); color:var(--text-muted); font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .kov-table th:first-child, .kov-table td:first-child{ text-align:left; position:sticky; left:0; z-index:1; background:var(--surface); }
    .kov-table th:first-child{ z-index:3; background:var(--surface-2); }
    .kov-table tbody tr:hover td{ background:var(--surface-2); }
    .kov-table tr.kov-lead td:first-child{ font-weight:650; color:var(--text); }
    .kov-table tr.kov-child td:first-child{ color:var(--text-muted); padding-left:24px; font-size:11.5px; }
    .kov-table tr.kov-group td{ border-top:2px solid var(--border); }
    .kov-pill{ display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--kov-tone-bg); color:var(--kov-tone); }
    .kov-delta.up{ color:var(--red); } .kov-delta.down{ color:var(--green); }
    .kov-score{ display:flex; align-items:center; gap:7px; justify-content:flex-end; }
    .kov-bar{ width:40px; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; }
    .kov-bar i{ display:block; height:100%; background:var(--kov-tone); }
    .kov-spark{ display:block; }

    /* ── ESTEIRA ON-TIME (Conveyor) — porte do mockup do Roberto
       ("esteira.html"). Reskinned pra usar as MESMAS variáveis/tema do
       resto do PULSO (var(--surface)/--text/--border/--orange etc., a
       mesma fonte Inter, os mesmos componentes .bkl-tabs/.kpi-strip) em
       vez da paleta industrial isolada da v1 — pedido do Roberto em
       2026-08-06, "ficar no mesmo template do site todo". As 3 esteiras
       usam os acentos já estabelecidos: SOC=laranja, HUB=âmbar, Termo=
       vermelho (a mesma ideia de "cada categoria tem uma cor" do resto
       do PULSO, só que com as cores do tema em vez de hex novos). ── */
    .est-app { color: var(--text); }
    .est-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--text-muted); margin:0 0 8px; }
    .est-sub{ margin:0; color:var(--text-sub); font-size:13px; max-width:56ch; }
    .est-masthead{ display:flex; flex-wrap:wrap; gap:24px; justify-content:space-between; align-items:flex-end; margin-bottom:16px; }
    .est-app h1{ font-weight:800; font-size:clamp(20px,2.6vw,26px); line-height:1.15; margin:0 0 4px; color:var(--text); }

    .est-stage{ display:none; }
    .est-stage.active{ display:block; }
    .est-stage-head{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 20px; margin-bottom:16px; box-shadow:var(--shadow); display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between; }
    .est-toolbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px 16px; margin-bottom:16px; box-shadow:var(--shadow); }
    .est-turno-btns{ display:flex; gap:6px; flex-wrap:wrap; }
    .est-turno-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-sub); font-size:12px; font-weight:600; padding:7px 13px; border-radius:var(--radius); cursor:pointer; transition:background var(--transition), color var(--transition), border-color var(--transition); }
    .est-turno-btn:hover{ border-color:var(--orange); }
    .est-turno-btn.active{ background:var(--orange); border-color:var(--orange); color:#fff; }
    .est-hora-range{ display:flex; align-items:center; gap:14px; }
    .est-hora-range label{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-sub); font-weight:600; }
    .est-hora-range select{ width:80px; }
    .est-title-block h2{ font-size:16px; font-weight:700; margin:0 0 3px; color:var(--text); }
    .est-composition{ font-size:12px; color:var(--text-sub); margin:0; }
    .est-composition b{ color:var(--text); font-weight:600; }
    .est-balance-block{ min-width:260px; flex:1; max-width:400px; }
    .est-balance-label{ display:flex; justify-content:space-between; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
    .est-balance-label span b{ font-variant-numeric:tabular-nums; color:var(--text); font-weight:700; }
    .est-balance-bar{ height:9px; border-radius:6px; overflow:hidden; display:flex; border:1px solid var(--border); }
    .est-balance-seg{ height:100%; }
    .est-balance-note{ font-size:9.5px; color:var(--text-muted); margin-top:6px; }

    .est-stage-body{ overflow-x:auto; padding-bottom:6px; }
    /* Piso simulado: cinza fixo (não segue tema claro/escuro) pra parecer
       de fato o chão do galpão embaixo da esteira, pedido do Roberto em
       2026-08-06 depois de ver a v2 (que só herdava var(--surface) do
       site) — aqui é deliberado ficar diferente do resto da página. */
    .est-belt-wrap{ min-width:1040px; display:flex; flex-direction:column; background:#9a9a96; border-radius:var(--radius-lg); padding:20px 16px 16px; box-shadow:inset 0 2px 10px rgba(0,0,0,.18); }
    .est-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; padding:0 6px; }
    .est-row-top{ align-items:end; margin-bottom:2px; }
    .est-row-bottom{ align-items:start; margin-top:2px; }
    .est-slot{ display:flex; flex-direction:column; align-items:stretch; }
    .est-connector{ width:2px; height:14px; background:repeating-linear-gradient(var(--border),var(--border) 3px,transparent 3px,transparent 7px); margin:0 auto; }

    .est-prod-card{ border:1.5px dashed var(--border); border-radius:var(--radius); background:var(--surface-2); padding:8px 10px; text-align:center; height:66px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    .est-prod-card .p-eyebrow{ font-size:9.5px; font-weight:700; letter-spacing:.14em; color:var(--text-muted); }
    .est-prod-card .p-value{ font-size:16px; font-weight:700; color:var(--text-muted); line-height:1.2; }
    .est-prod-card .p-hint{ font-size:9px; color:var(--text-muted); opacity:.8; }
    .est-prod-card.est-prod-pending{ border-style:dashed; opacity:.85; }
    .est-prod-card .p-hint.pending{ color:var(--stage-accent); opacity:1; font-weight:600; }
    .est-prod-card.est-prod-ready{ cursor:pointer; border-style:solid; }
    .est-prod-card.est-prod-ready .p-value{ color:var(--stage-accent); }
    .est-prod-card.est-prod-ready:hover{ background:color-mix(in srgb, var(--stage-accent) 10%, var(--surface-2)); }

    .est-bancada-card{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:11px 12px 10px; box-shadow:var(--shadow); overflow:hidden; height:260px; box-sizing:border-box; display:flex; flex-direction:column; cursor:pointer; transition:transform .12s ease; }
    .est-bancada-card:hover{ border-color:var(--stage-accent); }
    .est-bancada-card:active{ transform:scale(.98); }
    .est-bancada-card::before{ content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--stage-accent); }
    .est-bancada-card.est-highlight{ animation:estHighlightPulse 1.4s ease 2; }
    @keyframes estHighlightPulse{ 0%,100%{ box-shadow:var(--shadow); } 50%{ box-shadow:0 0 0 3px var(--stage-accent); } }
    .est-bancada-front, .est-bancada-back{ display:flex; flex-direction:column; height:100%; min-height:0; }
    .est-bancada-card.flipped .est-bancada-front{ display:none; }
    .est-bancada-back{ display:none; }
    .est-bancada-card.flipped .est-bancada-back{ display:flex; }
    .est-bancada-front-label{ font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
    .est-bancada-back-list{ list-style:none; margin:0; padding:0; flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
    .est-bancada-back-list li{ display:flex; justify-content:space-between; gap:8px; font-size:11px; padding:3px 0; border-top:1px solid var(--border); }
    .est-bancada-back-list li:first-child{ border-top:none; }
    .est-bancada-back-name{ color:var(--text-sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .est-bancada-back-qty{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--text); flex:none; }
    .est-bancada-back-note{ font-size:8.5px; color:var(--text-muted); margin-top:6px; flex:none; }
    .est-bancada-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; flex:none; }
    .est-bancada-tag{ font-weight:700; font-size:12px; letter-spacing:.04em; color:var(--stage-accent); background:color-mix(in srgb, var(--stage-accent) 16%, transparent); padding:2px 7px; border-radius:5px; }
    .est-bancada-share{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; flex:none; color:var(--text); }
    .est-bancada-qty{ font-size:10.5px; color:var(--text-sub); font-variant-numeric:tabular-nums; margin-bottom:6px; flex:none; }
    .est-bancada-fill-track{ height:5px; border-radius:4px; background:var(--surface-3); overflow:hidden; margin-bottom:8px; flex:none; }
    .est-bancada-fill{ height:100%; width:var(--fill); background:linear-gradient(90deg, color-mix(in srgb, var(--stage-accent) 60%, transparent), var(--stage-accent)); border-radius:4px; }

    .est-dest-list{ list-style:none; margin:0; padding:0; flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
    .est-dest-list li{ display:flex; justify-content:space-between; gap:8px; font-size:11px; padding:3px 0; border-top:1px solid var(--border); }
    .est-dest-list li:first-child{ border-top:none; }
    .est-dest-name{ color:var(--text-sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .est-dest-qty{ font-variant-numeric:tabular-nums; color:var(--text); flex:none; white-space:nowrap; }
    .est-dest-share{ color:var(--text-muted); font-weight:400; }
    .est-dest-list::-webkit-scrollbar{ width:6px; }
    .est-dest-list::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }

    .est-belt{ position:relative; margin:12px 0; }
    .est-belt-flags{ display:flex; justify-content:space-between; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:rgba(0,0,0,.5); padding:0 4px 6px; }
    .est-belt-flags .est-end{ text-align:right; }
    .est-belt-body{ position:relative; display:flex; align-items:center; }
    .est-belt-cap{ width:20px; height:50px; background:#2a2a2a; flex:none; }
    .est-belt-cap.left{ border-radius:10px 0 0 10px; }
    .est-belt-cap.right{ border-radius:0 10px 10px 0; }
    .est-belt-track{ position:relative; flex:1; height:50px; background:#333333; overflow:hidden; border-top:2px solid #1e1e1e; border-bottom:2px solid #1e1e1e; }
    .est-tread{ position:absolute; inset:0; background-image:repeating-linear-gradient(-35deg, rgba(255,255,255,.07) 0 10px, transparent 10px 26px); background-size:64px 64px; animation:estTreadScroll 5.5s linear infinite; }
    @keyframes estTreadScroll{ from{ background-position-x:0; } to{ background-position-x:64px; } }
    .est-diverters{ position:absolute; inset:0; pointer-events:none; }
    .est-diverter{ position:absolute; top:50%; width:9px; height:9px; transform:translate(-50%,-50%) rotate(45deg); background:var(--stage-accent); opacity:.85; box-shadow:0 0 0 3px color-mix(in srgb, var(--stage-accent) 22%, transparent); animation:estDiverterPulse 2.6s ease-in-out infinite; }
    @keyframes estDiverterPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
    .est-packages{ position:absolute; inset:0; }
    /* Caixas cor de caixa mesmo (kraft/papelão) — pedido explícito do
       Roberto, não faz sentido essas seguirem a cor de acento da esteira. */
    .est-pkg{ position:absolute; top:var(--lane); left:-10%; width:var(--w); height:var(--h); background:linear-gradient(160deg, #c68b4f, #8f5f30); border:1px solid rgba(0,0,0,.35); border-radius:2px; box-shadow:0 2px 4px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08); transform:translateY(-50%); animation-name:var(--anim, estPkgMove); animation-duration:var(--dur); animation-timing-function:linear; animation-iteration-count:infinite; animation-delay:var(--delay); }
    .est-pkg::after{ content:""; position:absolute; inset:38% 0 auto 0; height:24%; background:rgba(255,255,255,.18); }
    @keyframes estPkgMove{ from{ left:-10%; } to{ left:106%; } }
    @keyframes estPkgDivertA{ 0%{ left:-10%; opacity:1; } 52%{ opacity:1; } 60%{ opacity:0; } 100%{ left:106%; opacity:0; } }
    @keyframes estPkgDivertB{ 0%{ left:-10%; opacity:1; } 68%{ opacity:1; } 76%{ opacity:0; } 100%{ left:106%; opacity:0; } }
    @keyframes estPkgDivertC{ 0%{ left:-10%; opacity:1; } 36%{ opacity:1; } 44%{ opacity:0; } 100%{ left:106%; opacity:0; } }
    @media (prefers-reduced-motion: reduce){ .est-tread{ animation:none; } .est-pkg{ animation:none; left:8%; } .est-diverter{ animation:none; } }

    .est-stage[data-esteira="soc"]{ --stage-accent:var(--cyan); --seg-esq:var(--cyan); --seg-dir:color-mix(in srgb, var(--cyan) 45%, var(--surface-3)); }
    .est-stage[data-esteira="hub"]{ --stage-accent:var(--amber); --seg-esq:var(--amber); --seg-dir:color-mix(in srgb, var(--amber) 45%, var(--surface-3)); }
    .est-stage[data-esteira="termo"]{ --stage-accent:var(--orange); --seg-esq:var(--orange); --seg-dir:color-mix(in srgb, var(--orange) 45%, var(--surface-3)); }
    .est-balance-seg.esq{ background:var(--seg-esq); }
    .est-balance-seg.dir{ background:var(--seg-dir); }
    .est-side-label{ text-align:center; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(0,0,0,.55); margin:2px 0 8px; }
    .est-side-label b{ color:var(--stage-accent); }

    details.est-ranking{ margin-top:24px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; }
    details.est-ranking summary{ cursor:pointer; list-style:none; padding:14px 18px; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:space-between; color:var(--text); }
    details.est-ranking summary::-webkit-details-marker{ display:none; }
    details.est-ranking summary .est-arrow{ transition:transform .15s ease; color:var(--text-muted); font-size:11px; }
    details.est-ranking[open] summary .est-arrow{ transform:rotate(90deg); }
    .est-rank-table-wrap{ overflow-x:auto; border-top:1px solid var(--border); }
    table.est-rank-table{ width:100%; border-collapse:collapse; font-size:12px; min-width:600px; }
    table.est-rank-table th{ text-align:left; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); padding:8px 14px; border-bottom:1px solid var(--border); }
    table.est-rank-table td{ padding:6px 14px; border-bottom:1px solid var(--border); vertical-align:middle; color:var(--text); }
    table.est-rank-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
    table.est-rank-table td.bar-cell{ width:170px; }
    .est-mini-bar-track{ height:6px; background:var(--surface-3); border-radius:4px; overflow:hidden; }
    .est-mini-bar{ height:100%; background:var(--text-muted); border-radius:4px; }
    tr.est-class-SOC .est-mini-bar{ background:var(--orange); }
    tr.est-class-3PL .est-mini-bar{ background:color-mix(in srgb, var(--orange) 45%, var(--text-muted)); }
    tr.est-class-HUB .est-mini-bar{ background:var(--amber); }
    tr.est-class-XPT .est-mini-bar{ background:color-mix(in srgb, var(--amber) 45%, var(--text-muted)); }
    .est-tag-chip{ font-size:9px; font-weight:700; letter-spacing:.06em; padding:1.5px 6px; border-radius:4px; }
    .est-tag-chip.SOC{ background:color-mix(in srgb, var(--orange) 20%, transparent); color:var(--orange); }
    .est-tag-chip.est-3PL{ background:var(--surface-3); color:var(--text-sub); }
    .est-tag-chip.HUB{ background:color-mix(in srgb, var(--amber) 20%, transparent); color:var(--amber); }
    .est-tag-chip.XPT{ background:color-mix(in srgb, var(--amber) 12%, transparent); color:var(--amber); }

    .est-footnote{ margin-top:14px; font-size:11px; color:var(--text-muted); line-height:1.6; max-width:80ch; }
    .est-footnote code{ background:var(--surface-2); padding:1px 5px; border-radius:4px; }
    .jarvis-cadence-tag { display: inline-block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: #fff; padding: 2px 8px; border-radius: 20px; vertical-align: middle; white-space: nowrap; }
    .jarvis-cadence-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
    .jarvis-cadence-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #fff; opacity: .8; }

    /* Guia de reuniões */
    .meetings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
      gap: 14px;
    }
    .meeting-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px; overflow: hidden;
      transition: border-color var(--transition);
    }
    .meeting-card:hover { border-color: var(--orange); }
    .meeting-card-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .meeting-letter {
      width: 32px; height: 32px; border-radius: var(--radius);
      background: linear-gradient(135deg,var(--orange),#ff8c00);
      color: #fff; font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .meeting-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .meeting-field {
      display: flex; gap: 8px; margin-bottom: 7px;
      font-size: 12px; align-items: flex-start;
    }
    .meeting-field-label { font-weight: 700; color: var(--text-muted); min-width: 90px; flex-shrink: 0; font-size: 11px; }
    .meeting-field-val { color: var(--text); flex: 1; }
    .meeting-field-val input, .meeting-field-val textarea {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; padding: 4px 8px; font-size: 11px;
      color: var(--text); outline: none; font-family: inherit; resize: none;
      transition: border-color var(--transition);
    }
    .meeting-field-val input:focus, .meeting-field-val textarea:focus { border-color: var(--orange); }

    /* Pontos Focais */
    .focal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
      gap: 12px;
    }
    .focal-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color var(--transition);
    }
    .focal-card:hover { border-color: var(--orange); }
    .focal-area {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .06em; color: var(--orange);
    }
    .focal-name-row { display: flex; align-items: center; gap: 10px; }
    .focal-avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg,var(--orange),#ff8c00);
      color: #fff; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .focal-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .focal-role { font-size: 11px; color: var(--text-muted); }
    .focal-contact {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .focal-contact-field {
      flex: 1; min-width: 120px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 8px; font-size: 11px; color: var(--text);
      outline: none; font-family: inherit;
      transition: border-color var(--transition);
    }
    .focal-contact-field:focus { border-color: var(--orange); }

    /* Mapa de Dados */
    .data-map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
      gap: 16px;
    }
    .data-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px;
      transition: border-color var(--transition);
    }
    .data-card:hover { border-color: var(--orange); }
    .data-card-type {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700;
      margin-bottom: 10px;
    }
    .data-card-type.sql   { background: rgba(6,182,212,.12);  color: var(--cyan); }
    .data-card-type.py    { background: rgba(16,185,129,.12); color: #10b981; }
    .data-card-type.link  { background: rgba(238,77,45,.1);   color: var(--orange); }
    .data-card-type.sheet { background: rgba(245,158,11,.12); color: #f59e0b; }
    .data-card-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .data-card-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; }
    .data-card-code {
      background: var(--surface-3); border-radius: var(--radius);
      padding: 10px 12px; font-size: 11px; font-family: 'Share Tech Mono','Courier New',monospace;
      color: var(--cyan); overflow-x: auto; white-space: pre; max-height: 120px;
      border: 1px solid var(--border);
    }
    .data-card-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px; font-size: 11px; font-weight: 600;
      color: var(--orange); text-decoration: none;
      transition: opacity var(--transition);
    }
    .data-card-link:hover { opacity: .75; }
    .data-card-input {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 7px 10px; font-size: 12px;
      color: var(--text); outline: none; font-family: inherit; margin-top: 6px;
      transition: border-color var(--transition);
    }
    .data-card-input:focus { border-color: var(--orange); }

    /* ── MONITOR - LIVE (Outbound) — porte do mockup do Roberto
       ("monitor_operacional_viagens.html"), timeline de viagens (STA/STD/
       ATD). Reskinned pro tema do site (var(--surface)/--text/--border/
       --orange etc.) em vez da paleta própria do mockup — pedido do
       Roberto em 2026-08-13, "coloque no template que estamos usando
       atual", mesmo padrão já usado na Esteira On-time. ── */
    .mon-toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px 16px; margin-bottom:14px; box-shadow:var(--shadow); }
    .mon-toolbar select.filter-select, .mon-toolbar input.filter-select{ min-width:150px; }
    .mon-toolbar input.filter-select{ min-width:180px; }
    .mon-toolbar-spacer{ flex:1; }
    .mon-now-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-sub); font-size:12px; font-weight:600; padding:7px 14px; border-radius:var(--radius); cursor:pointer; white-space:nowrap; }
    .mon-now-btn:hover{ border-color:var(--orange); color:var(--text); }
    .mon-last{ font-size:11px; color:var(--text-muted); white-space:nowrap; }
    .mon-alert-btn{ position:relative; display:flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:12px; font-weight:700; padding:7px 14px; border-radius:var(--radius); cursor:pointer; white-space:nowrap; }
    .mon-alert-btn:hover{ border-color:var(--amber); }
    .mon-alert-count{ background:var(--red); color:#fff; font-size:10.5px; font-weight:800; border-radius:10px; padding:1px 6px; min-width:16px; text-align:center; }
    .mon-alert-count[data-zero="1"]{ background:var(--text-muted); opacity:.6; }
    .mon-view-switcher{ display:flex; gap:6px; flex-wrap:wrap; }
    .mon-view-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-sub); font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:var(--radius); cursor:pointer; }
    .mon-view-btn:hover{ border-color:var(--orange); }
    .mon-view-btn.active{ background:var(--orange); border-color:var(--orange); color:#fff; }
    .mon-group-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-sub); font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:var(--radius); cursor:pointer; white-space:nowrap; }
    .mon-group-btn:hover{ border-color:var(--orange); }
    .mon-group-btn.active{ background:var(--cyan); border-color:var(--cyan); color:#fff; }

    .mon-alert-panel{ display:none; position:absolute; right:0; top:calc(100% + 8px); width:340px; max-height:420px; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg,var(--shadow)); z-index:80; padding:10px; }
    .mon-alert-panel.open{ display:block; }
    .mon-alert-item{ display:flex; align-items:flex-start; gap:8px; padding:8px 8px; border-radius:var(--radius); font-size:12px; color:var(--text-sub); }
    .mon-alert-item:hover{ background:var(--surface-2); cursor:pointer; }
    .mon-alert-item b{ color:var(--text); }
    .mon-alert-empty{ padding:14px 8px; font-size:12px; color:var(--text-muted); text-align:center; }

    .mon-timeline-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px; }
    .mon-scroll{ overflow-x:auto; }
    .mon-timehead{ display:flex; min-width:1800px; border-bottom:1px solid var(--border); background:var(--surface-2); position:sticky; top:0; z-index:4; }
    .mon-timehead-meta{ width:340px; flex:none; position:sticky; left:0; z-index:5; background:var(--surface-2); }
    .mon-hours{ position:relative; flex:1; height:28px; }
    .mon-hour-label{ position:absolute; top:0; font-size:10px; color:var(--text-muted); transform:translateX(-50%); padding-top:6px; }
    .mon-rows{ position:relative; min-width:1800px; }
    .mon-row{ display:flex; align-items:center; border-bottom:1px solid var(--border); }
    .mon-row:hover .mon-row-meta{ background:var(--surface-2); }
    .mon-row-meta{ width:340px; flex:none; padding:8px 12px; display:flex; align-items:center; gap:8px; font-size:12px; overflow:hidden; position:sticky; left:0; z-index:3; background:var(--surface); }
    .mon-row-tag{ position:absolute; top:4px; right:6px; font-size:9px; font-weight:800; color:#fff; padding:1px 7px; border-radius:8px; text-transform:uppercase; letter-spacing:.02em; z-index:4; white-space:nowrap; max-width:120px; overflow:hidden; text-overflow:ellipsis; }
    .mon-row-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
    .mon-row-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mon-row-text b{ color:var(--text); font-weight:700; }
    .mon-row-sub{ color:var(--text-muted); font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mon-row-ender{ color:var(--cyan); font-size:10px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
    .mon-row-ender i{ margin-right:3px; opacity:.8; }
    .mon-track{ position:relative; flex:1; height:40px; cursor:pointer; border-radius:var(--radius); }
    /* Viagem com tag ativa (pedido do Roberto em 2026-08-13): contorno azul
       na linha do tempo inteira, não só o chip do nome — dá pra notar o
       andamento sem precisar ler o texto. */
    .mon-track.mon-track-tagged{ box-shadow:inset 0 0 0 2px var(--cyan); background:color-mix(in srgb, var(--cyan) 6%, transparent); }
    .mon-bar{ position:absolute; top:14px; height:12px; border-radius:6px; opacity:.9; }
    .mon-bar:hover{ opacity:1; filter:brightness(1.08); }
    .mon-atd{ position:absolute; top:8px; width:2px; height:24px; background:var(--green); }
    .mon-now-line{ position:absolute; top:0; width:2px; height:100%; background:var(--amber); z-index:5; }
    .mon-now-line::after{ content:"AGORA"; position:absolute; top:-14px; left:3px; font-size:9px; font-weight:800; color:var(--amber); white-space:nowrap; }
    .mon-group-row{ background:var(--surface-3); font-size:11px; font-weight:700; color:var(--text-sub); padding:6px 12px; text-transform:uppercase; letter-spacing:.05em; }
    .mon-empty{ padding:30px; text-align:center; color:var(--text-muted); font-size:13px; }
    .mon-legend{ display:flex; flex-wrap:wrap; gap:14px; padding:10px 16px; font-size:11px; color:var(--text-muted); border-top:1px solid var(--border); }
    .mon-legend span{ display:inline-flex; align-items:center; gap:5px; }
    .mon-legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }

    .mon-detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px; }
    .mon-detail-item{ background:var(--surface-3); border-radius:var(--radius); padding:9px 12px; }
    .mon-detail-label{ font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }
    .mon-detail-value{ font-size:13px; color:var(--text); font-weight:600; }
    .mon-detail-full{ grid-column:1/-1; }
    .mon-tag-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border); }
    .mon-tag-chip{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-sub); font-size:11px; font-weight:700; padding:5px 11px; border-radius:12px; cursor:pointer; }
    .mon-tag-chip:hover{ border-color:var(--orange); }
    .mon-tag-chip.active{ color:#fff; border-color:transparent; }
    .mon-tag-meta{ width:100%; font-size:10.5px; color:var(--text-muted); margin-top:2px; }

    /* Painel de ruas de endereçamento do destino (botão de clusterização no
       header do drawer, pedido do Roberto em 2026-08-13) — amostragem das
       ruas com volume desse destino + as configuradas pra ele na config. */
    .mon-cluster-panel{ display:none; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border); }
    .mon-cluster-panel.open{ display:block; }
    #mon-cluster-btn.active{ background:var(--orange); color:#fff; }
    .mon-cluster-head{ font-size:10px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
    .mon-rua-card{ background:var(--surface-3); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px; }
    .mon-rua-top{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
    .mon-rua-nome{ font-size:13px; font-weight:800; color:var(--text); }
    .mon-rua-flag{ font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2px 6px; border-radius:7px; background:color-mix(in srgb, var(--cyan) 18%, transparent); color:var(--cyan); }
    .mon-rua-ocup{ margin-left:auto; font-size:11px; font-weight:700; color:var(--text-sub); white-space:nowrap; }
    .mon-rua-bar{ height:4px; border-radius:2px; background:var(--surface); overflow:hidden; margin-bottom:8px; }
    .mon-rua-bar i{ display:block; height:100%; border-radius:2px; background:var(--cyan); }
    .mon-rua-bar i[data-cheia="1"]{ background:var(--red); }
    .mon-rua-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
    .mon-rua-stat{ text-align:center; }
    .mon-rua-stat b{ display:block; font-size:12.5px; font-weight:800; color:var(--text); line-height:1.25; }
    .mon-rua-stat span{ font-size:8.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
    .mon-cluster-empty{ font-size:12px; color:var(--text-muted); padding:10px 2px; }
    @media(max-width:900px){ .mon-toolbar{ flex-direction:column; align-items:stretch; } .mon-detail-grid{ grid-template-columns:1fr; } .mon-rua-stats{ grid-template-columns:repeat(2,1fr); } }

    /* ── PERFORMANCE EXECUTIVA ───────────────────────────────── */
    .perf-score-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px 16px;
      display: flex; flex-direction: column; gap: 10px;
      position: relative; overflow: hidden;
      transition: transform .18s, box-shadow .18s;
    }
    .perf-score-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .perf-score-card::before {
      content: ''; position: absolute; top:0; left:0; right:0; height:3px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .perf-score-card.green::before { background:#10b981; }
    .perf-score-card.amber::before { background:#f59e0b; }
    .perf-score-card.red::before   { background:#ef4444; }

    .perf-score-header { display:flex; align-items:center; justify-content:space-between; }
    .perf-score-area   { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); }
    .perf-score-dot {
      width:10px; height:10px; border-radius:50%; flex-shrink:0;
    }
    .perf-score-dot.green { background:#10b981; box-shadow:0 0 6px rgba(16,185,129,.5); }
    .perf-score-dot.amber { background:#f59e0b; box-shadow:0 0 6px rgba(245,158,11,.5); }
    .perf-score-dot.red   { background:#ef4444; box-shadow:0 0 6px rgba(239,68,68,.5); }

    .perf-score-main  { font-size:32px; font-weight:800; line-height:1; color:var(--text); }
    .perf-score-label { font-size:11px; color:var(--text-muted); }
    .perf-score-bar-bg { height:5px; background:var(--surface-3); border-radius:3px; overflow:hidden; }
    .perf-score-bar-fill { height:100%; border-radius:3px; transition:width .5s; }
    .green .perf-score-bar-fill { background:#10b981; }
    .amber .perf-score-bar-fill { background:#f59e0b; }
    .red   .perf-score-bar-fill { background:#ef4444; }
    .perf-score-meta { font-size:10px; color:var(--text-muted); display:flex; justify-content:space-between; }

    /* Secondary KPI row per area */
    .perf-kpi-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 18px;
      display: flex; align-items: center; gap: 0;
    }
    .perf-kpi-area-label {
      font-size:11px; font-weight:800; text-transform:uppercase;
      letter-spacing:.06em; color:var(--orange);
      min-width:100px; flex-shrink:0;
      display:flex; align-items:center; gap:6px;
    }
    .perf-kpi-divider { width:1px; background:var(--border); align-self:stretch; margin:0 16px; }
    .perf-kpi-items { display:flex; flex:1; gap:0; flex-wrap:wrap; }
    .perf-kpi-item {
      flex:1; min-width:120px;
      padding:0 16px; border-right:1px solid var(--border);
    }
    .perf-kpi-item:last-child { border-right:none; }
    .perf-kpi-item-label { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:3px; }
    .perf-kpi-item-value { font-size:18px; font-weight:800; color:var(--text); line-height:1; }
    .perf-kpi-item-delta { font-size:10px; font-weight:600; margin-top:2px; }
    .perf-kpi-item-delta.up   { color:#10b981; }
    .perf-kpi-item-delta.down { color:#ef4444; }
    .perf-kpi-item-delta.warn { color:#f59e0b; }

    @media(max-width:900px){
      #perf-score-grid { grid-template-columns:repeat(2,1fr) !important; }
      .perf-kpi-row { flex-direction:column; gap:12px; }
      .perf-kpi-divider { width:100%; height:1px; margin:4px 0; }
      .perf-kpi-items { flex-direction:column; }
      .perf-kpi-item { border-right:none; border-bottom:1px solid var(--border); padding:8px 0; }
      .perf-kpi-item:last-child { border-bottom:none; }
    }

    /* ── SKELETON LOADER ─────────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -800px 0; }
      100% { background-position: 800px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg,
        var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: var(--radius);
    }
    .skeleton-strip {
      height: 100px; width: 100%; border-radius: var(--radius-lg);
    }

    /* ── JORNAL ──────────────────────────────────────────────── */
    .jornal-tabs {
      display: flex; gap: 2px; margin-bottom: 28px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 4px; width: fit-content;
    }
    .jornal-tab {
      padding: 9px 22px; border-radius: var(--radius);
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      cursor: pointer; transition: all var(--transition);
      letter-spacing: .03em; display: flex; align-items: center; gap: 7px;
    }
    .jornal-tab.active { background: var(--orange); color: #fff; box-shadow: 0 2px 12px rgba(238,77,45,.35); }
    .jornal-tab:not(.active):hover { background: var(--surface-2); color: var(--text); }

    .jornal-panel { display: none; }
    .jornal-panel.active { display: block; }

    /* ── Jornal Semanal ── */
    /* Linha de edição real (PDFs em /jornais) — reaproveita o visual de
       .jornal-article, só que o card inteiro é clicável e abre o PDF. Só a
       mais recente ganha o destaque laranja; as demais ficam no visual
       padrão de .jornal-article. */
    .jrn-ed-row { cursor: pointer; }
    .jornal-article.jrn-ed-row.latest { border-color: var(--orange); background: rgba(238,77,45,.04); }
    .jrn-ed-row .jornal-article-num { color: rgba(238,77,45,.3); }

    /* Visualizador de edição — tela cheia, só o PDF, sem cromo de modal */
    .jrn-viewer-full {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: #202124;
    }
    .jrn-viewer-full.open { display: block; }
    .jrn-viewer-full iframe {
      width: 100%; height: 100%; border: none; background: #525659;
    }
    .jrn-viewer-close {
      position: fixed; top: 16px; right: 20px; z-index: 301;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(0,0,0,.55); color: #fff; border: none;
      font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .jrn-viewer-close:hover { background: rgba(238,77,45,.85); }
    .jornal-header-card {
      background: linear-gradient(135deg, #1a1d2e 0%, rgba(238,77,45,.15) 100%);
      border: 1px solid rgba(238,77,45,.25);
      border-radius: var(--radius-lg); padding: 32px 36px;
      margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .jornal-header-card::before {
      content: 'JARVIS INFORMA';
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      font-size: 80px; font-weight: 900; color: rgba(238,77,45,.06);
      letter-spacing: -.02em; pointer-events: none;
      font-family: 'Inter', sans-serif;
    }
    .jornal-edition {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .15em; color: var(--orange); margin-bottom: 8px;
    }
    .jornal-title-big {
      /* Cor fixa (não var(--text)): o card tem fundo escuro sempre, nos dois
         temas — var(--text) é escuro no tema claro e ficava ilegível aqui. */
      font-size: 28px; font-weight: 800; color: #f4f5fa; margin-bottom: 6px; line-height: 1.2;
    }
    .jornal-meta { font-size: 12px; color: rgba(244,245,250,.65); }

    .jornal-articles { display: flex; flex-direction: column; gap: 14px; }
    .jornal-article {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 22px 24px;
      display: flex; gap: 20px; align-items: flex-start;
      transition: border-color var(--transition);
    }
    .jornal-article:hover { border-color: var(--orange); }
    .jornal-article-num {
      font-size: 32px; font-weight: 900; color: rgba(238,77,45,.15);
      min-width: 44px; line-height: 1; font-family: 'Inter',sans-serif;
      flex-shrink: 0;
    }
    .jornal-article-body { flex: 1; }
    .jornal-article-tag {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .1em; color: var(--orange); margin-bottom: 6px;
      display: flex; align-items: center; gap: 5px;
    }
    .jornal-article-title {
      font-size: 16px; font-weight: 700; color: var(--text);
      margin-bottom: 8px; cursor: pointer;
    }
    .jornal-article-title:hover { color: var(--orange); }
    .jornal-article-content {
      font-size: 13px; color: var(--text-muted); line-height: 1.7;
      border: none; background: none; outline: none; width: 100%;
      font-family: inherit; resize: vertical; min-height: 60px;
    }
    .jornal-add-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px; border: 1.5px dashed var(--border);
      border-radius: var(--radius-lg); cursor: pointer; color: var(--text-muted);
      font-size: 12px; font-weight: 600; margin-top: 6px;
      transition: border-color var(--transition), color var(--transition), background var(--transition);
    }
    .jornal-add-btn:hover { border-color: var(--orange); color: var(--orange); background: rgba(238,77,45,.04); }

    /* ── Aniversariantes ── */
    .bday-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }
    .bday-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px 16px;
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; text-align: center;
      transition: border-color var(--transition), transform var(--transition);
      position: relative; overflow: hidden;
    }
    .bday-card:hover { border-color: var(--orange); transform: translateY(-2px); }
    .bday-card.today { border-color: var(--orange); background: rgba(238,77,45,.04); }
    .bday-card.today::before {
      content: '🎂'; position: absolute; top: 8px; right: 10px; font-size: 16px;
    }
    .bday-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg,var(--orange),#ff8c00);
      color: #fff; font-size: 18px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border); overflow: hidden; flex-shrink: 0;
    }
    .bday-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .bday-sector { font-size: 11px; color: var(--text-muted); }
    .bday-date {
      font-size: 12px; font-weight: 700; color: var(--orange);
      background: rgba(238,77,45,.1); padding: 2px 10px;
      border-radius: 20px;
    }

    /* ── Avisos RH ── */
    .aviso-list { display: flex; flex-direction: column; gap: 12px; }
    .aviso-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px 22px;
      display: flex; gap: 16px; align-items: flex-start;
      transition: border-color var(--transition);
    }
    .aviso-card:hover { border-color: var(--orange); }
    .aviso-icon {
      width: 38px; height: 38px; border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .aviso-icon.info    { background: rgba(6,182,212,.12);  color: var(--cyan); }
    .aviso-icon.warning { background: rgba(245,158,11,.12); color: #f59e0b; }
    .aviso-icon.success { background: rgba(16,185,129,.12); color: #10b981; }
    .aviso-icon.alert   { background: rgba(239,68,68,.12);  color: #ef4444; }
    .aviso-body { flex: 1; }
    .aviso-title {
      font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 5px;
      border: none; background: none; outline: none; width: 100%;
      font-family: inherit; cursor: text;
    }
    .aviso-content {
      font-size: 12px; color: var(--text-muted); line-height: 1.6;
      border: none; background: none; outline: none; width: 100%;
      font-family: inherit; resize: vertical; min-height: 40px;
    }
    .aviso-meta { font-size: 10px; color: var(--text-muted); margin-top: 6px; }

    /* ── Campanhas ── */
    .campanha-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .campanha-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
      transition: border-color var(--transition), transform var(--transition);
    }
    .campanha-card:hover { border-color: var(--orange); transform: translateY(-2px); }
    .campanha-thumb {
      height: 140px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; cursor: pointer; position: relative;
      border-bottom: 1px solid var(--border); overflow: hidden;
    }
    .campanha-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .campanha-thumb-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .campanha-thumb:hover .campanha-thumb-overlay { opacity: 1; }
    .campanha-body { padding: 16px; }
    .campanha-tag {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .1em; color: var(--orange); margin-bottom: 6px;
    }
    .campanha-title {
      font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px;
      border: none; background: none; outline: none; width: 100%;
      font-family: inherit; cursor: text;
    }
    .campanha-desc {
      font-size: 12px; color: var(--text-muted); line-height: 1.5;
      border: none; background: none; outline: none; width: 100%;
      font-family: inherit; resize: vertical; min-height: 40px;
    }
    .campanha-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-muted);
    }
    input.aviso-title:focus, textarea.aviso-content:focus,
    input.campanha-title:focus, textarea.campanha-desc:focus,
    textarea.jornal-article-content:focus {
      background: rgba(238,77,45,.04) !important;
      border-radius: 4px;
    }

    /* ── CODEX-INSPIRED VISUAL LAYER ─────────────────────────────────────── */
    /* Keeps the portal functionality intact while giving it a calmer, focused
       light workspace aesthetic. */
    :root {
      --bg: #fff4ef;
      --surface: rgba(255, 255, 255, .82);
      --surface-2: rgba(255, 239, 232, .88);
      --surface-3: rgba(255, 213, 196, .94);

      --text-sub: #56617e;
      --text-muted: #75809b;

      --orange-l: #d83c20;
      --orange-ll: #a92b18;
      --cyan: #5d8dff;
      --cyan-l: #91b5ff;
      --green: #65d1a5;
      --amber: #f0b86c;
      --red: #e6533b;
      --radius: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --shadow: 0 12px 30px rgba(151, 66, 35, .13);
      --shadow-lg: 0 30px 75px rgba(151, 66, 35, .20);
      /* Versões opacas de --surface/--surface-2, só pra elementos sticky (ex:
         coluna fixa da tabela de Clusterização) — --surface* normal é
         translúcido de propósito (visual "glass"), mas isso deixa o conteúdo
         que passa por baixo aparecendo através da coluna fixa ao rolar. */
      --surface-solid: #fdf3ee;
      --surface-2-solid: #fdece2;
    }

    body {
      font-family: 'S\00f6 hne', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    /* Apply the Codex-style type stack consistently to every textual element.
       Font Awesome icon classes are deliberately excluded so icons keep working. */
    body,
    body :not(.fa):not(.fas):not(.far):not(.fal):not(.fab):not([class^="fa-"]):not([class*=" fa-"]) {

    /* ── TV NIGHT MODE — template escuro dedicado pra apresentação/TV,
       independente do tema claro/escuro normal. Fica por último de
       propósito: a camada Codex acima é sempre clara (sem gate de tema,

       sobrescreve precisa ser refeita aqui manualmente pra realmente

    [data-tv-night="1"] {
      --bg:            #0a0e1c;
      --surface:       #111731;
      --surface-2:     #161d3a;
      --surface-3:     #1c2545;
      --border:        rgba(148,163,184,.12);
      --text:          #eef1f8;

      --shadow-lg:     0 10px 36px rgba(0,0,0,.6);
      --surface-solid: #111731;
      --surface-2-solid: #161d3a;
      /* A camada Codex escurece esses tons de acento pra ficarem legíveis
         no fundo claro dela — no preto do night mode eles ficam quase
         invisíveis, então volta pra versão viva (mesma do tema escuro

      --orange-l:  #ff6633;
      --orange-ll: #ff8c5a;
      --cyan:      #06b6d4;

<script>
/* Tema compartilha a mesma chave do JARVIS (jarvis-theme) — trocar aqui
   reflete lá e vice-versa. Aplicado antes do render pra não piscar. */
(function(){
  try{
    const salvo = localStorage.getItem('jarvis-theme');
    if(salvo) document.documentElement.setAttribute('data-theme', salvo);
  }catch(e){}
})();
function arvToggleTheme(){
  const atual = document.documentElement.getAttribute('data-theme') || 'dark';
  const proximo = atual === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', proximo);
  try{ localStorage.setItem('jarvis-theme', proximo); }catch(e){}
  arvSyncThemeLabel();
}
function arvSyncThemeLabel(){
  const atual = document.documentElement.getAttribute('data-theme') || 'dark';
  const lbl = document.getElementById('arvp-theme-label');
  const ico = document.getElementById('arvp-theme-icon');
  if(lbl) lbl.textContent = atual === 'dark' ? 'Tema Claro' : 'Tema Escuro';
  if(ico) ico.className = atual === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

/* Versão enxuta do setBadge do JARVIS (aqui só existe um badge). */
function setBadge(secao, estado, texto){
  const el = document.getElementById('ds-badge-arvore');
  if(!el) return;
  el.className = 'ds-badge ' + (estado === 'ok' ? 'ok' : estado === 'erro' ? 'err' : 'loading');
  el.textContent = estado === 'loading' ? 'carregando…' : (texto || '');
}

/* Helpers extraídos do index.html na geração (ver scripts/build-arvore.js). */
function pulsoEscHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildKPIs(id, kpis){
  const c=document.getElementById(id); if(!c) return;
  c.innerHTML=`<div class="kpi-strip">${kpis.map(k=>`
    <div class="kpi-strip-item ${k.type} ${k.clickable?'kpi-clickable':''} ${k.active?'kpi-active':''}" ${k.onclickAttr?`onclick="${k.onclickAttr}"`:''}>
      <div class="kpi-strip-label">${k.label}</div>
      <div class="kpi-strip-value">${k.value}</div>
      ${k.sub ? `<div class="kpi-strip-sub">${k.sub}</div>` : ''}
      ${k.delta ? `<div class="kpi-strip-delta ${k.trend}">
        <i class="fas fa-arrow-trend-${k.trend}"></i> ${k.delta}
      </div>` : ''}
      <i class="fas ${k.icon} kpi-strip-icon"></i>
    </div>`).join('')}</div>`;
}
</script>

<script src="/assets/arvore.js"></script>

<script>
/* Aqui quem troca de subpágina é o menu da esquerda — mantém o item certo
   destacado mesmo quando a troca vem de outro ponto (ex: clique num KPI). */
const arvSwitchSubpageBase = arvSwitchSubpage;
arvSwitchSubpage = function(chave, el){
  arvSwitchSubpageBase(chave, el);
  document.querySelectorAll('.arvp-navitem[data-sub]').forEach(n =>
    n.classList.toggle('active', n.dataset.sub === chave));
};

arvSyncThemeLabel();
arvLoad();
</script>
